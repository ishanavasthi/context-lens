name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextlens
          POSTGRES_PASSWORD: contextlens
          POSTGRES_DB: contextlens
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U contextlens -d contextlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://contextlens:contextlens@localhost:54329/contextlens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The extension reads VITE_ variables at build time and the API reads the
      # same file at boot, so the checked in example is the source of truth here
      # too. Without it the device token is undefined and the e2e suite cannot
      # authenticate.
      - name: Create env file
        run: cp .env.example .env

      - run: npm run typecheck
      - run: npm run lint

      - name: Apply migrations and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - run: npm run build
      - run: npm run test --workspace @contextlens/api
      - run: npm run test --workspace @contextlens/extension

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
